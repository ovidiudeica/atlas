name: Website CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Serialize complete main builds and Pages deploys. A prior Pages deployment
# must finish before the next main workflow starts (HTTP 400 otherwise).
# PR checks use separate ref-specific groups and do not block each other.
concurrency:
  group: atlas-website-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Static regression tests
        run: npm test
      - name: SIM-R7 deterministic evidence generation
        run: node scripts/audit/sim-r7/12-verify-reproducibility.mjs
      - name: SIM-R8 deterministic targeted evidence generation
        run: node scripts/audit/sim-r8/03-verify-reproducibility.mjs
      - name: Type-check and build
        run: npm run build
      - name: WEB-AUDIT.5 image request regression
        env:
          AUDIT_LABEL: after
        run: node scripts/audit/web-audit-5/image-network.mjs
      - name: Chromium desktop/mobile smoke
        run: node scripts/ci/browser-smoke.mjs
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/browser-smoke/*.png
          if-no-files-found: warn
      - name: Store build
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist/
      - uses: actions/configure-pages@v5
      # Re-runs share artifacts with earlier attempts of the same run, so use
      # an attempt-unique name to avoid deploy-pages' duplicate-artifact error.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
