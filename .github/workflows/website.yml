name: Website CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Static regression tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Chromium desktop/mobile smoke
        run: node scripts/ci/browser-smoke.mjs
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/browser-smoke/*.png
          if-no-files-found: warn
      - name: Store build
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
