name: Website CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Serialize complete main builds and Pages deploys. A prior Pages deployment
# must finish before the next main workflow starts (HTTP 400 otherwise).
# PR checks use separate ref-specific groups and do not block each other.
concurrency:
  group: atlas-website-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Static regression tests
        run: npm test
      - name: SIM-R7 deterministic evidence generation
        run: node scripts/audit/sim-r7/12-verify-reproducibility.mjs
      - name: SIM-R8 deterministic targeted evidence generation
        run: node scripts/audit/sim-r8/03-verify-reproducibility.mjs
      - name: SIM-CLOSE deterministic closure verification
        run: node scripts/audit/sim-close/verify-reproducibility.mjs
      - name: Type-check and build
        run: npm run build
      - name: WEB-AUDIT.5 image request regression
        env:
          AUDIT_LABEL: ci-after
        run: node scripts/audit/web-audit-5/image-network.mjs
      - name: WEB-AUDIT.5 accessibility and recovery
        env:
          AUDIT_LABEL: ci
        run: node scripts/audit/web-audit-5/accessibility-resilience.mjs
      - name: WEB-AUDIT.5 native browser zoom200
        env:
          AUDIT_LABEL: ci
        run: node scripts/audit/web-audit-5/native-zoom.mjs
      - name: WEB-AUDIT.5 final repeated performance and unavailable images
        env:
          AUDIT_LABEL: ci
        run: node scripts/audit/web-audit-5/final-performance.mjs
      - name: WEB-AUDIT.5 selected and visible original exports
        env:
          AUDIT_LABEL: ci
        run: node scripts/audit/web-audit-5/verify-exports.mjs
      - name: WEB-AUDIT.5 effective target areas and spacing
        env:
          AUDIT_LABEL: ci
        run: node scripts/audit/web-audit-5/target-areas.mjs
      - name: Chromium desktop/mobile smoke
        run: node scripts/ci/browser-smoke.mjs
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/browser-smoke/*.png
          if-no-files-found: warn
      - name: Store WEB-AUDIT.5 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-audit-5-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/audits/web-audit-5/image-network-ci-after.json
            docs/audits/web-audit-5/accessibility-resilience-ci.json
            docs/audits/web-audit-5/native-zoom-ci.json
            docs/audits/web-audit-5/final-performance-ci.json
            docs/audits/web-audit-5/exports-ci.json
            docs/audits/web-audit-5/target-areas-ci.json
          if-no-files-found: warn
      - name: Store build
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist/
      - uses: actions/configure-pages@v5
      # Re-runs share artifacts with earlier attempts of the same run, so use
      # an attempt-unique name to avoid deploy-pages' duplicate-artifact error.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      # Artifact storage can acknowledge upload before the Actions REST list
      # exposes it. Fail closed rather than starting a deployment too early.
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.PAGES_ARTIFACT and .expired == false) | .id' > "$RUNNER_TEMP/pages-artifact-ids"; then
              if [ "$(wc -l < "$RUNNER_TEMP/pages-artifact-ids")" -eq 1 ]; then
                echo "Pages artifact visible: $(cat "$RUNNER_TEMP/pages-artifact-ids")"
                exit 0
              fi
            fi
            echo "Waiting for Pages artifact (attempt $attempt/30)"
            sleep 5
          done
          echo "::error::Expected unique Pages artifact not visible in Actions REST API"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published historical 1930 assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import time
          import urllib.request

          import os
          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          root = pathlib.Path("dist")
          relative = pathlib.Path("data/historical/v1/rohgis")
          paths = sorted(p.relative_to(root) for p in (root / relative).rglob("*") if p.is_file())
          if len(paths) != 18:
              raise SystemExit(f"Expected 18 RoHGIS files, found {len(paths)}")
          paths.append(pathlib.Path("index.html"))
          for attempt in range(12):
              failures = []
              for path in paths:
                  try:
                      url = base + path.as_posix() + "?build=" + os.environ["GITHUB_SHA"]
                      req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "Atlas-postdeploy-verification"})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      expected = hashlib.sha256((root / path).read_bytes()).hexdigest()
                      if actual != expected:
                          failures.append(f"{path}: SHA-256 mismatch")
                  except Exception as exc:
                      failures.append(f"{path}: {exc}")
              if not failures:
                  print(f"Published assets match verified build: {len(paths)}/{len(paths)}")
                  break
              print(f"Attempt {attempt + 1}: {failures}")
              time.sleep(10)
          else:
              raise SystemExit("Public asset verification failed")
          PY
